services:
  - type: web
    name: aulaviva-api
    runtime: go
    plan: free
    rootDir: backend
    buildCommand: go build -o bin/aulaviva ./cmd/api
    startCommand: ./bin/aulaviva
    envVars:
      - key: AULAVIVA_DB_PATH
        value: aulaviva.db
      - key: AULAVIVA_ALLOWED_ORIGIN
        value: https://aula-viva-cf.vercel.app
