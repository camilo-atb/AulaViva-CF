services:
  - type: web
    name: aulaviva-api
    runtime: go
    plan: starter
    rootDir: backend
    buildCommand: go build -o bin/aulaviva ./cmd/api
    startCommand: ./bin/aulaviva
    envVars:
      - key: AULAVIVA_DB_PATH
        value: /var/data/aulaviva.db
      - key: AULAVIVA_ALLOWED_ORIGIN
        sync: false
    disk:
      name: aulaviva-data
      mountPath: /var/data
      sizeGB: 1
